<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070709"><title>FOOD RADAR｜附近美食探索</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<header><a class="logo" href="#"><i>✦</i> FOOD <b>RADAR</b></a><button id="locate">⌖ 使用我的位置</button></header>
<main>
<section class="hero"><div class="eyebrow">✦ DISCOVER FOOD NEAR YOU</div><h1>今天，<em>吃什麼？</em></h1><p>把你附近值得吃的美食，一次找出來。</p><div class="search"><span>⌕</span><input id="q" autocomplete="off" placeholder="搜尋牛肉麵、燒肉、咖啡、火鍋…"><button id="search">探索</button></div><div class="chips" id="chips"><button class="active" data-c="all">✦ 全部</button><button data-c="restaurant">🍜 餐廳</button><button data-c="cafe">☕ 咖啡</button><button data-c="fastfood">🍔 速食</button><button data-c="japanese">🍣 日料</button><button data-c="bbq">🥩 燒肉</button><button data-c="hotpot">🍲 火鍋</button><button data-c="dessert">🍰 甜點</button><button data-c="night">🌙 宵夜</button></div></section>
<section class="bar"><div><small>NEAR YOU</small><h2>附近值得吃</h2><p id="status">按「開始探索」取得目前位置。</p></div><div class="bar-actions"><select id="sort"><option value="distance">距離最近</option><option value="name">店名排序</option></select><button id="random">✦ 隨便吃一間</button></div></section>
<section class="work"><aside><div id="empty" class="empty"><strong>⌖</strong><h3>先讓我知道你在哪</h3><p>FOOD RADAR 會搜尋你附近 5 公里內的美食。</p><button id="start">開始探索 →</button></div><div id="results"></div></aside><div class="map"><div id="map"></div><label>● LIVE NEARBY</label></div></section>
</main><div id="modal" class="modal"><article><button id="close">×</button><div id="detail"></div></article></div><div id="toast"></div><footer><b>FOOD RADAR ✦</b><span>探索附近。找到值得吃的。</span></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
